# Manual fallback only.
#
# The `release: released` trigger is deliberately gone. The admin panel writes update.xml
# itself now — publish commits it as one step of a sequence that has already checked the
# release carries RazorReaper-Setup.exe, and `make-current` rewrites it for a rollback
# (RR-Admin-Panel docs/release-management-design.md §6). Leaving the trigger in would put
# two writers on master racing over the same file, and would silently undo a rollback the
# moment anything else got published.
#
# What is left is the fallback for a day the panel or the NAS is down: dispatch it by hand
# with the tag to point update.xml at. It is not part of the normal release path.

name: Update update.xml (manual fallback)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to point update.xml at (e.g. v1.4.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch update.xml
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Without the release trigger there is no event payload to read the body from, so
          # the notes sync asks the API for it. An empty body just leaves <notes> alone.
          RELEASE_BODY="$(gh release view "${TAG_NAME}" --json body -q .body 2>/dev/null || true)"

          # v1.4.4 -> 1.4.4 -> 1.4.4.0
          tag_clean="${TAG_NAME#v}"
          xml_version="${tag_clean}.0"

          installer_url="https://github.com/${REPO}/releases/download/${TAG_NAME}/RazorReaper-Setup.exe"
          changelog_url="https://github.com/${REPO}/releases/tag/${TAG_NAME}"

          sed -i \
            -e "s|<version>.*</version>|<version>${xml_version}</version>|" \
            -e "s|<url>.*</url>|<url>${installer_url}</url>|" \
            -e "s|<changelog>.*</changelog>|<changelog>${changelog_url}</changelog>|" \
            update.xml

          # Sync the in-app "What's new" <notes> from the release body's bullet list.
          # (The version/url above are always patched; notes only update when the body
          #  has "-"/"*" bullet lines, otherwise the existing notes are left untouched.)
          bullets="$(printf '%s' "${RELEASE_BODY:-}" | tr -d '\r' | grep -E '^[[:space:]]*[-*][[:space:]]+' || true)"
          if [ -n "${bullets}" ]; then
            NOTES="$(printf '%s\n' "${bullets}" \
              | sed -E 's/^[[:space:]]*[-*][[:space:]]+//' \
              | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
              | sed -E 's/^/- /')"
            export NOTES
            perl -0777 -i -pe 's|<notes>.*?</notes>|"<notes>\n".$ENV{NOTES}."\n    </notes>"|se' update.xml
            echo "Synced in-app notes from the release body."
          else
            echo "No bullet lines in the release body - leaving <notes> unchanged."
          fi

          echo "--- Updated update.xml ---"
          cat update.xml

      - name: Commit and push
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet update.xml; then
            echo "update.xml already at ${TAG_NAME} - nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.xml
          git commit -m "Bump update.xml to ${TAG_NAME} [skip ci]"
          git push origin master
