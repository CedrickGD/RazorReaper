<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RazorReaper</title>
    <base href="/" />
    <!-- Shared styles -->
    <link href="css/shared/theme.css" rel="stylesheet" />
    <link href="css/shared/navbar.css" rel="stylesheet" />
    <link href="css/shared/notifications.css" rel="stylesheet" />
    <link href="css/shared/widget-highlights.css" rel="stylesheet" />
    <link href="css/shared/global-search-styles.css" rel="stylesheet" />
    <link rel="icon" href="data:," />
    <!-- Page styles -->
    <link href="css/pages/home-styles.css" rel="stylesheet" />
    <link href="css/pages/server-styles.css" rel="stylesheet" />
    <link href="css/pages/game-styles.css" rel="stylesheet" />
    <link href="css/pages/ini-changer-styles.css" rel="stylesheet" />
    <link href="css/pages/suitfov-styles.css" rel="stylesheet" />
    <link href="css/pages/launch-options-styles.css" rel="stylesheet" />
    <link href="css/pages/fonts-styles.css" rel="stylesheet" />
    <link href="css/pages/autoclicker-styles.css" rel="stylesheet" />
    <link href="css/pages/building-styles.css" rel="stylesheet" />
    <link href="css/pages/crafting-scripts-styles.css" rel="stylesheet" />
    <link href="css/pages/credits-styles.css" rel="stylesheet" />
    <link href="css/pages/dino-prices-styles.css" rel="stylesheet" />
    <link href="css/pages/oc-bps-styles.css" rel="stylesheet" />
    <link href="css/pages/bosses-styles.css" rel="stylesheet" />
    <link href="css/pages/map-mods-styles.css" rel="stylesheet" />
    <link href="css/pages/steam-mods-styles.css" rel="stylesheet" />
    <link href="css/pages/troubleshoot-styles.css" rel="stylesheet" />
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <canvas id="network-canvas"></canvas>

    <!-- Load navbar runtime early so the saved sidebar width/collapsed state is applied
         before Blazor paints the first frame (avoids a 240px → user-width jump). -->
    <script src="js/navbar.js"></script>

    <div id="app">Loading...</div>

    <div id="startup-error" class="startup-error" aria-live="polite">
        <div class="startup-error-card">
            <div class="startup-error-title">Startup Error</div>
            <div class="startup-error-code" data-startup-code>RR-E1001</div>
            <div class="startup-error-message" data-startup-message>
                The UI did not finish loading. Restart the app or reinstall.
            </div>
            <div class="startup-error-hint">Share this code when asking for support.</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <audio id="notify-audio" src="assets/sounds/notify.mp3" preload="metadata"></audio>
    <audio id="click-audio" preload="metadata"></audio>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        (function () {
            const appHost = document.getElementById('app');
            const errorHost = document.getElementById('startup-error');
            if (!appHost || !errorHost) return;

            let uiReady = false;
            const observer = new MutationObserver(() => {
                if (appHost.textContent && appHost.textContent.trim() !== 'Loading...') {
                    uiReady = true;
                    errorHost.classList.remove('visible');
                    observer.disconnect();
                }
            });

            observer.observe(appHost, { childList: true, subtree: true, characterData: true });

            function showStartupError(code, message) {
                const codeNode = errorHost.querySelector('[data-startup-code]');
                const messageNode = errorHost.querySelector('[data-startup-message]');
                if (codeNode) codeNode.textContent = code;
                if (messageNode) messageNode.textContent = message;
                errorHost.classList.add('visible');
                try {
                    localStorage.setItem('razorReaperStartupError', JSON.stringify({
                        code: code,
                        message: message,
                        time: new Date().toISOString()
                    }));
                } catch (e) {
                    // Ignore storage errors.
                }
            }

            window.addEventListener('error', () => {
                if (!uiReady) {
                    showStartupError('RR-E1002', 'A startup script failed before the UI loaded.');
                }
            });

            window.addEventListener('unhandledrejection', () => {
                if (!uiReady) {
                    showStartupError('RR-E1002', 'A startup script failed before the UI loaded.');
                }
            });

            setTimeout(() => {
                if (uiReady) return;
                if (appHost.textContent && appHost.textContent.trim() !== 'Loading...') return;
                showStartupError('RR-E1001', 'The UI did not finish loading. Restart the app or reinstall.');
            }, 8000);
        })();
        const soundDefaults = {
            enabled: true,
            notificationEnabled: true,
            clickEnabled: true,
            notificationSource: 'assets/sounds/notify.mp3',
            clickSource: 'assets/sounds/globalclick.mp3',
            notificationLabel: 'Default (Notify)',
            clickLabel: 'Default (Global Click)',
            notificationCustom: false,
            clickCustom: false,
            notificationVolume: 0.35,
            clickVolume: 0.2
        };

        const legacyClickLabel = 'Default (Soft Click)';

        function normalizeSoundSettings(settings) {
            if (!settings || typeof settings !== 'object') {
                return {};
            }

            const normalized = { ...settings };

            if (!normalized.notificationSource || typeof normalized.notificationSource !== 'string' || normalized.notificationSource.trim() === '') {
                delete normalized.notificationSource;
            }

            if (!normalized.clickSource || typeof normalized.clickSource !== 'string' || normalized.clickSource.trim() === '') {
                delete normalized.clickSource;
            }

            if (!normalized.notificationCustom && (!normalized.notificationLabel || normalized.notificationLabel.trim() === '')) {
                delete normalized.notificationLabel;
            }

            if (!normalized.clickCustom && (!normalized.clickLabel || normalized.clickLabel.trim() === '' || normalized.clickLabel === legacyClickLabel)) {
                delete normalized.clickLabel;
            }

            return normalized;
        }

        function coerceSoundDefaults(settings) {
            const resolved = settings || {};

            if (!resolved.notificationSource) {
                resolved.notificationSource = soundDefaults.notificationSource;
            }

            if (!resolved.clickSource) {
                resolved.clickSource = soundDefaults.clickSource;
            }

            if (!resolved.notificationCustom) {
                resolved.notificationLabel = soundDefaults.notificationLabel;
            }

            if (!resolved.clickCustom) {
                resolved.clickLabel = soundDefaults.clickLabel;
            }

            return resolved;
        }

        function applySoundSettings(settings, persist) {
            settings = coerceSoundDefaults(settings);
            if (persist) {
                try {
                    localStorage.setItem('razorReaperSoundSettings', JSON.stringify(settings));
                } catch (e) {
                    // Ignore storage errors.
                }
            }

            const notifyAudio = document.getElementById('notify-audio');
            if (notifyAudio && settings.notificationSource) {
                notifyAudio.src = settings.notificationSource;
                notifyAudio.load();
            }

            const clickAudio = document.getElementById('click-audio');
            if (clickAudio) {
                if (settings.clickSource) {
                    clickAudio.src = settings.clickSource;
                } else {
                    clickAudio.removeAttribute('src');
                }
                clickAudio.load();
            }
        }

        window.getSoundSettings = function () {
            if (window._soundSettings) {
                return window._soundSettings;
            }

            let stored = {};
            try {
                const raw = localStorage.getItem('razorReaperSoundSettings');
                if (raw) {
                    stored = JSON.parse(raw);
                }
            } catch (e) {
                stored = {};
            }

            stored = normalizeSoundSettings(stored);
            window._soundSettings = coerceSoundDefaults(Object.assign({}, soundDefaults, stored));
            applySoundSettings(window._soundSettings, false);
            return window._soundSettings;
        };

        window.updateSoundSettings = function (settings) {
            const current = window.getSoundSettings();
            const normalized = normalizeSoundSettings(settings || {});
            window._soundSettings = coerceSoundDefaults(Object.assign({}, current, normalized));
            applySoundSettings(window._soundSettings, true);
            return window._soundSettings;
        };

        const fontDefaults = {
            presetId: 'system',
            uiStack: '',
            monoStack: ''
        };

        function normalizeFontSettings(settings) {
            if (!settings || typeof settings !== 'object') {
                return {};
            }

            const normalized = { ...settings };

            if (!normalized.presetId || typeof normalized.presetId !== 'string') {
                delete normalized.presetId;
            }

            if (!normalized.uiStack || typeof normalized.uiStack !== 'string' || normalized.uiStack.trim() === '') {
                delete normalized.uiStack;
            }

            if (!normalized.monoStack || typeof normalized.monoStack !== 'string' || normalized.monoStack.trim() === '') {
                delete normalized.monoStack;
            }

            return normalized;
        }

        function applyFontSettings(settings, persist) {
            const resolved = Object.assign({}, fontDefaults, settings || {});

            if (persist) {
                try {
                    localStorage.setItem('razorReaperFontSettings', JSON.stringify(resolved));
                } catch (e) {
                    // Ignore storage errors.
                }
            }

            const root = document.documentElement;
            if (resolved.uiStack) {
                root.style.setProperty('--font-primary', resolved.uiStack);
            }
            if (resolved.monoStack) {
                root.style.setProperty('--font-mono', resolved.monoStack);
            }

            return resolved;
        }

        window.getFontSettings = function () {
            if (window._fontSettings) {
                return window._fontSettings;
            }

            let stored = {};
            try {
                const raw = localStorage.getItem('razorReaperFontSettings');
                if (raw) {
                    stored = JSON.parse(raw);
                }
            } catch (e) {
                stored = {};
            }

            stored = normalizeFontSettings(stored);
            window._fontSettings = applyFontSettings(stored, false);
            return window._fontSettings;
        };

        window.updateFontSettings = function (settings) {
            const normalized = normalizeFontSettings(settings || {});
            window._fontSettings = applyFontSettings(normalized, true);
            return window._fontSettings;
        };

        try {
            window.getFontSettings();
        } catch (e) {
            // Ignore font initialization errors.
        }

        function getSoundSettingsSafe() {
            try {
                return window.getSoundSettings();
            } catch (e) {
                return soundDefaults;
            }
        }

        const clickSoundDelayMs = 200;
        const clickSoundSuppressMs = 400;
        let clickSoundTimeoutId = null;
        let clickSoundToken = 0;
        let clickSoundSuppressedUntil = 0;

        function playAudioElement(audio, volume) {
            if (!audio) return;
            try {
                audio.volume = volume;
                audio.currentTime = 0;
                const playPromise = audio.play();
                if (playPromise && playPromise.catch) {
                    playPromise.catch(() => { });
                }
            } catch (e) {
                // Ignore audio errors.
            }
        }

        function suppressClickSoundFor(durationMs) {
            const until = Date.now() + durationMs;
            if (until > clickSoundSuppressedUntil) {
                clickSoundSuppressedUntil = until;
            }

            if (clickSoundTimeoutId) {
                clearTimeout(clickSoundTimeoutId);
                clickSoundTimeoutId = null;
            }

            clickSoundToken++;
        }

        function scheduleClickSound() {
            const token = ++clickSoundToken;

            if (clickSoundTimeoutId) {
                clearTimeout(clickSoundTimeoutId);
                clickSoundTimeoutId = null;
            }

            clickSoundTimeoutId = setTimeout(() => {
                if (clickSoundToken !== token) return;
                if (Date.now() < clickSoundSuppressedUntil) return;

                window.playClickSound();
                clickSoundTimeoutId = null;
            }, clickSoundDelayMs);
        }

        function playClickFallback() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                if (!window._clickAudioContext) {
                    window._clickAudioContext = new AudioContext();
                }

                const context = window._clickAudioContext;
                if (context.state === 'suspended') {
                    context.resume();
                }

                const oscillator = context.createOscillator();
                const gain = context.createGain();
                const now = context.currentTime;

                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(900, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                oscillator.connect(gain);
                gain.connect(context.destination);

                oscillator.start(now);
                oscillator.stop(now + 0.04);
            } catch (e) {
                // Ignore audio errors.
            }
        }

        window.playNotificationSound = function () {
            suppressClickSoundFor(clickSoundSuppressMs);

            const settings = getSoundSettingsSafe();
            if (!settings.enabled || !settings.notificationEnabled) return;

            const audio = document.getElementById('notify-audio');
            playAudioElement(audio, settings.notificationVolume ?? 0.35);
        };

        window.playClickSound = function () {
            const settings = getSoundSettingsSafe();
            if (!settings.enabled || !settings.clickEnabled) return;

            const audio = document.getElementById('click-audio');
            if (audio && audio.src) {
                playAudioElement(audio, settings.clickVolume ?? 0.2);
                return;
            }

            playClickFallback();
        };

        function ensureClickSoundListener() {
            if (window._clickSoundListenerAttached) {
                return;
            }

            window._clickSoundListenerAttached = true;
            document.addEventListener('click', (event) => {
                const settings = getSoundSettingsSafe();
                if (!settings.enabled || !settings.clickEnabled) return;

                if (!(event.target instanceof Element)) return;

                const interactive = event.target.closest('button, a, input, select, textarea, [role="button"], .clickable');
                if (!interactive || interactive.hasAttribute('disabled')) return;
                if (interactive.closest('[data-sound-skip]')) return;

                scheduleClickSound();
            }, true);
        }

        ensureClickSoundListener();

        window.startLocationPicker = function (dotNetRef) {
            // Just notify C# to start picking - it will handle everything
            dotNetRef.invokeMethodAsync('StartGlobalLocationPicker');
        };

        window.renderHeatmap = function (clickData) {
            const canvas = document.getElementById('heatmapCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Count clicks per position
            const clickMap = {};
            clickData.forEach(click => {
                const key = `${click.x},${click.y}`;
                clickMap[key] = (clickMap[key] || 0) + 1;
            });

            // Find max clicks
            const maxClicks = Math.max(...Object.values(clickMap));

            // Draw heatmap
            Object.entries(clickMap).forEach(([key, count]) => {
                const [x, y] = key.split(',').map(Number);
                const intensity = count / maxClicks;

                // Scale coordinates to canvas
                const canvasX = (x / screen.width) * canvas.width;
                const canvasY = (y / screen.height) * canvas.height;

                // Color from blue (cold) to red (hot)
                const r = Math.floor(255 * intensity);
                const g = Math.floor(255 * (1 - intensity) * 0.5);
                const b = Math.floor(255 * (1 - intensity));
                const alpha = 0.3 + (intensity * 0.7);

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(canvasX, canvasY, 20, 0, Math.PI * 2);
                ctx.fill();

                // Add glow effect for hot spots
                if (intensity > 0.7) {
                    ctx.fillStyle = `rgba(255, 255, 0, ${intensity * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(canvasX, canvasY, 30, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        };
    </script>

    <script>
        (function () {
            let _searchRef = null;
            let _keyHandler = null;

            window.registerGlobalSearch = function (dotNetRef) {
                _searchRef = dotNetRef;
                _keyHandler = function (e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        e.stopPropagation();
                        if (_searchRef) {
                            _searchRef.invokeMethodAsync('ToggleSearch');
                        }
                    }
                };
                document.addEventListener('keydown', _keyHandler, true);
            };

            window.triggerGlobalSearch = function () {
                if (_searchRef) {
                    _searchRef.invokeMethodAsync('ToggleSearch');
                }
            };

            window.unregisterGlobalSearch = function () {
                if (_keyHandler) {
                    document.removeEventListener('keydown', _keyHandler, true);
                    _keyHandler = null;
                }
                _searchRef = null;
            };
        })();
    </script>

    <script src="js/network-animation.js"></script>

    <!-- Runtime test runner. Bails out unless _tests/test-config.json has
         "enabled": true, so end-user installs incur ~zero overhead. -->
    <script src="_tests/test-runner.js"></script>
</body>
</html>
