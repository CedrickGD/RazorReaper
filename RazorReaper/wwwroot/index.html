<body>
    <div class="status-bar-safe-area"></div>

    <canvas id="network-canvas"></canvas>

    <!-- Load navbar runtime early so the saved sidebar width/collapsed state is applied
         before Blazor paints the first frame (avoids a 240px → user-width jump). -->
    <script src="js/navbar.js"></script>

    <div id="app">Loading...</div>

    <div id="startup-error" class="startup-error" aria-live="polite">
        <div class="startup-error-card">
            <div class="startup-error-title">Startup Error</div>
            <div class="startup-error-code" data-startup-code>RR-E1001</div>
            <div class="startup-error-message" data-startup-message>
                The UI did not finish loading. Restart the app or reinstall.
            </div>
            <div class="startup-error-hint">Share this code when asking for support.</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <audio id="notify-audio" src="assets/sounds/notify.mp3" preload="metadata"></audio>
    <audio id="click-audio" preload="metadata"></audio>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        (function () {
            const appHost = document.getElementById('app');
            const errorHost = document.getElementById('startup-error');
            if (!appHost || !errorHost) return;

            let uiReady = false;
            const observer = new MutationObserver(() => {
                if (appHost.textContent && appHost.textContent.trim() !== 'Loading...') {
                    uiReady = true;
                    errorHost.classList.remove('visible');
                    observer.disconnect();
                }
            });

            observer.observe(appHost, { childList: true, subtree: true, characterData: true });

            function showStartupError(code, message) {
                const codeNode = errorHost.querySelector('[data-startup-code]');
                const messageNode = errorHost.querySelector('[data-startup-message]');
                if (codeNode) codeNode.textContent = code;
                if (messageNode) messageNode.textContent = message;
                errorHost.classList.add('visible');
                try {
                    localStorage.setItem('razorReaperStartupError', JSON.stringify({
                        code: code,
                        message: message,
                        time: new Date().toISOString()
                    }));
                } catch (e) {
                    // Ignore storage errors.
                }
            }

            window.addEventListener('error', () => {
                if (!uiReady) {
                    showStartupError('RR-E1002', 'A startup script failed before the UI loaded.');
                }
            });

            window.addEventListener('unhandledrejection', () => {
                if (!uiReady) {
                    showStartupError('RR-E1002', 'A startup script failed before the UI loaded.');
                }
            });

            setTimeout(() => {
                if (uiReady) return;
                if (appHost.textContent && appHost.textContent.trim() !== 'Loading...') return;
                showStartupError('RR-E1001', 'The UI did not finish loading. Restart the app or reinstall.');
            }, 8000);
        })();
        const soundDefaults = {
            enabled: true,
            notificationEnabled: true,
            clickEnabled: true,
            notificationSource: 'assets/sounds/notify.mp3',
            clickSource: 'assets/sounds/globalclick.mp3',
            notificationLabel: 'Default (Notify)',
            clickLabel: 'Default (Global Click)',
            notificationCustom: false,
            clickCustom: false,
            notificationVolume: 0.35,
            clickVolume: 0.2
        };

        const legacyClickLabel = 'Default (Soft Click)';

        function normalizeSoundSettings(settings) {
            if (!settings || typeof settings !== 'object') {
                return {};
            }

            const normalized = { ...settings };

            if (!normalized.notificationSource || typeof normalized.notificationSource !== 'string' || normalized.notificationSource.trim() === '') {
                delete normalized.notificationSource;
            }

            if (!normalized.clickSource || typeof normalized.clickSource !== 'string' || normalized.clickSource.trim() === '') {
                delete normalized.clickSource;
            }

            if (!normalized.notificationCustom && (!normalized.notificationLabel || normalized.notificationLabel.trim() === '')) {
                delete normalized.notificationLabel;
            }

            if (!normalized.clickCustom && (!normalized.clickLabel || normalized.clickLabel.trim() === '' || normalized.clickLabel === legacyClickLabel)) {
                delete normalized.clickLabel;
            }

            return normalized;
        }

        function coerceSoundDefaults(settings) {
            const resolved = settings || {};

            if (!resolved.notificationSource) {
                resolved.notificationSource = soundDefaults.notificationSource;
            }

            if (!resolved.clickSource) {
                resolved.clickSource = soundDefaults.clickSource;
            }

            if (!resolved.notificationCustom) {
                resolved.notificationLabel = soundDefaults.notificationLabel;
            }

            if (!resolved.clickCustom) {
                resolved.clickLabel = soundDefaults.clickLabel;
            }

            return resolved;
        }

        function applySoundSettings(settings, persist) {
            settings = coerceSoundDefaults(settings);
            if (persist) {
                try {
                    localStorage.setItem('razorReaperSoundSettings', JSON.stringify(settings));
                } catch (e) {
                    // Ignore storage errors.
                }
            }

            const notifyAudio = document.getElementById('notify-audio');
            if (notifyAudio && settings.notificationSource) {
                notifyAudio.src = settings.notificationSource;
                notifyAudio.load();
            }

            const clickAudio = document.getElementById('click-audio');
            if (clickAudio) {
                if (settings.clickSource) {
                    clickAudio.src = settings.clickSource;
                } else {
                    clickAudio.removeAttribute('src');
                }
                clickAudio.load();
            }
        }

        window.getSoundSettings = function () {
            if (window._soundSettings) {
                return window._soundSettings;
            }

            let stored = {};
            try {
                const raw = localStorage.getItem('razorReaperSoundSettings');
                if (raw) {
                    stored = JSON.parse(raw);
                }
            } catch (e) {
                stored = {};
            }

            stored = normalizeSoundSettings(stored);
            window._soundSettings = coerceSoundDefaults(Object.assign({}, soundDefaults, stored));
            applySoundSettings(window._soundSettings, false);
            return window._soundSettings;
        };

        window.updateSoundSettings = function (settings) {
            const current = window.getSoundSettings();
            const normalized = normalizeSoundSettings(settings || {});
            window._soundSettings = coerceSoundDefaults(Object.assign({}, current, normalized));
            applySoundSettings(window._soundSettings, true);
            return window._soundSettings;
        };

        const fontDefaults = {
            presetId: 'system',
            uiStack: '',
            monoStack: ''
        };

        function normalizeFontSettings(settings) {
            if (!settings || typeof settings !== 'object') {
                return {};
            }

            const normalized = { ...settings };

            if (!normalized.presetId || typeof normalized.presetId !== 'string') {
                delete normalized.presetId;
            }

            if (!normalized.uiStack || typeof normalized.uiStack !== 'string' || normalized.uiStack.trim() === '') {
                delete normalized.uiStack;
            }

            if (!normalized.monoStack || typeof normalized.monoStack !== 'string' || normalized.monoStack.trim() === '') {
                delete normalized.monoStack;
            }

            return normalized;
        }

        function applyFontSettings(settings, persist) {
            const resolved = Object.assign({}, fontDefaults, settings || {});

            if (persist) {
                try {
                    localStorage.setItem('razorReaperFontSettings', JSON.stringify(resolved));
                } catch (e) {
                    // Ignore storage errors.
                }
            }

            const root = document.documentElement;
            if (resolved.uiStack) {
                root.style.setProperty('--font-primary', resolved.uiStack);
            }
            if (resolved.monoStack) {
                root.style.setProperty('--font-mono', resolved.monoStack);
            }

            return resolved;
        }

        window.getFontSettings = function () {
            if (window._fontSettings) {
                return window._fontSettings;
            }

            let stored = {};
            try {
                const raw = localStorage.getItem('razorReaperFontSettings');
                if (raw) {
                    stored = JSON.parse(raw);
                }
            } catch (e) {
                stored = {};
            }

            stored = normalizeFontSettings(stored);
            window._fontSettings = applyFontSettings(stored, false);
            return window._fontSettings;
        };

        window.updateFontSettings = function (settings) {
            const normalized = normalizeFontSettings(settings || {});
            window._fontSettings = applyFontSettings(normalized, true);
            return window._fontSettings;
        };

        try {
            window.getFontSettings();
        } catch (e) {
            // Ignore font initialization errors.
        }

        // ---- Accent color (theme) settings -------------------------------------
        // The user picks ONE accent color; the lighter/darker/soft shades are
        // derived from it (same lightness offsets the original purple used), so the
        // whole UI re-tints cohesively. Power users can override individual shades
        // via the Advanced section (any blank field falls back to the derived value).
        // Every purple in the app references --accent-purple* (see theme.css), so we
        // only need to set those few variables here; --glow-purple and the gradients
        // reference them and recompute automatically.
        const THEME_DEFAULT_ACCENT = '#8b5cf6';
        const themeDefaults = { accent: THEME_DEFAULT_ACCENT, light: '', dark: '', darker: '', soft: '' };
        const THEME_VARS = [
            '--accent-purple', '--accent-purple-rgb', '--accent-purple-light',
            '--accent-purple-dark', '--accent-purple-darker', '--accent-purple-soft'
        ];

        function themeIsBlank(v) { return !v || typeof v !== 'string' || v.trim() === ''; }

        function themeClamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

        function themeParseHex(hex) {
            if (typeof hex !== 'string') return null;
            let h = hex.trim().replace(/^#/, '');
            if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
            if (h.length === 8) { h = h.substring(0, 6); } // drop alpha channel
            if (h.length !== 6 || /[^0-9a-fA-F]/.test(h)) return null;
            return {
                r: parseInt(h.substring(0, 2), 16),
                g: parseInt(h.substring(2, 4), 16),
                b: parseInt(h.substring(4, 6), 16)
            };
        }

        function themeRgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0; const l = (max + min) / 2;
            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                if (max === r) { h = (g - b) / d + (g < b ? 6 : 0); }
                else if (max === g) { h = (b - r) / d + 2; }
                else { h = (r - g) / d + 4; }
                h /= 6;
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        function themeHslToHex(h, s, l) {
            h = ((h % 360) + 360) % 360;
            s = themeClamp(s, 0, 100) / 100;
            l = themeClamp(l, 0, 100) / 100;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; }
            else if (h < 120) { r = x; g = c; }
            else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; }
            else { r = c; b = x; }
            const to = (v) => themeClamp(Math.round((v + m) * 255), 0, 255).toString(16).padStart(2, '0');
            return '#' + to(r) + to(g) + to(b);
        }

        // Hand-tuned original purple ramp. Returned verbatim when the accent is the
        // default so the shades stay pixel-identical even if the user overrides only
        // one of them in Advanced (the HSL derivation is a touch more saturated than
        // these originals, so we don't want it to silently shift the untouched shades).
        const THEME_DEFAULT_RAMP = {
            base: '#8b5cf6', light: '#a78bfa', dark: '#6d28d9',
            darker: '#5b21b6', soft: '#c4b5fd', rgb: '139, 92, 246'
        };

        // Derive the full shade ramp from a single base accent color. The lightness
        // offsets match the original purple ramp (base 66% L -> light +10, dark -16,
        // darker -24, soft +19), so any chosen color yields a coherent set of shades.
        function themeDeriveRamp(accentHex) {
            const rgb = themeParseHex(accentHex) || themeParseHex(THEME_DEFAULT_ACCENT);
            const hsl = themeRgbToHsl(rgb.r, rgb.g, rgb.b);
            const base = themeHslToHex(hsl.h, hsl.s, hsl.l);
            if (base.toLowerCase() === THEME_DEFAULT_ACCENT) {
                return Object.assign({}, THEME_DEFAULT_RAMP);
            }
            return {
                base: base,
                light: themeHslToHex(hsl.h, hsl.s, hsl.l + 10),
                dark: themeHslToHex(hsl.h, hsl.s, hsl.l - 16),
                darker: themeHslToHex(hsl.h, hsl.s, hsl.l - 24),
                soft: themeHslToHex(hsl.h, Math.min(hsl.s, 96), hsl.l + 19),
                rgb: rgb.r + ', ' + rgb.g + ', ' + rgb.b
            };
        }

        function normalizeThemeSettings(settings) {
            if (!settings || typeof settings !== 'object') return {};
            const out = {};
            ['accent', 'light', 'dark', 'darker', 'soft'].forEach((k) => {
                if (typeof settings[k] === 'string') { out[k] = settings[k]; }
            });
            return out;
        }

        function applyThemeSettings(settings, persist) {
            const resolved = Object.assign({}, themeDefaults, normalizeThemeSettings(settings));
            const accent = themeIsBlank(resolved.accent) ? THEME_DEFAULT_ACCENT : resolved.accent.trim();
            resolved.accent = accent;

            if (persist) {
                try {
                    localStorage.setItem('razorReaperThemeSettings', JSON.stringify(resolved));
                } catch (e) {
                    // Ignore storage errors.
                }
            }

            const root = document.documentElement;
            const isDefault = accent.toLowerCase() === THEME_DEFAULT_ACCENT
                && themeIsBlank(resolved.light) && themeIsBlank(resolved.dark)
                && themeIsBlank(resolved.darker) && themeIsBlank(resolved.soft);

            if (isDefault) {
                // No customization: clear inline overrides so the stylesheet's
                // hand-tuned default purple renders exactly as before.
                THEME_VARS.forEach((v) => root.style.removeProperty(v));
                return resolved;
            }

            const ramp = themeDeriveRamp(accent);
            root.style.setProperty('--accent-purple', ramp.base);
            root.style.setProperty('--accent-purple-rgb', ramp.rgb);
            root.style.setProperty('--accent-purple-light', themeIsBlank(resolved.light) ? ramp.light : resolved.light.trim());
            root.style.setProperty('--accent-purple-dark', themeIsBlank(resolved.dark) ? ramp.dark : resolved.dark.trim());
            root.style.setProperty('--accent-purple-darker', themeIsBlank(resolved.darker) ? ramp.darker : resolved.darker.trim());
            root.style.setProperty('--accent-purple-soft', themeIsBlank(resolved.soft) ? ramp.soft : resolved.soft.trim());
            return resolved;
        }

        window.getThemeSettings = function () {
            if (window._themeSettings) return window._themeSettings;
            let stored = {};
            try {
                const raw = localStorage.getItem('razorReaperThemeSettings');
                if (raw) { stored = JSON.parse(raw); }
            } catch (e) {
                stored = {};
            }
            window._themeSettings = applyThemeSettings(stored, false);
            return window._themeSettings;
        };

        // C# sends the full settings object every time (blank shade = auto-derive),
        // mirroring how font/sound settings persist.
        window.updateThemeSettings = function (settings) {
            window._themeSettings = applyThemeSettings(settings || {}, true);
            return window._themeSettings;
        };

        window.resetThemeSettings = function () {
            window._themeSettings = applyThemeSettings({}, true);
            return window._themeSettings;
        };

        // Preview a color without persisting — used while the user is dragging the
        // picker so the UI updates live but nothing is saved until they commit.
        window.previewThemeAccent = function (settings) {
            applyThemeSettings(settings || {}, false);
        };

        try {
            window.getThemeSettings();
        } catch (e) {
            // Ignore theme initialization errors.
        }

        // Runs the inline accent picker's saturation/value drag entirely in JS so there is
        // NO per-move JS<->.NET round-trip or Blazor re-render: it positions the handle and
        // previews the color live, then reports the final hex once on release (pointerup)
        // via the .NET [JSInvokable] OnSvCommitted. Pointer capture keeps the drag tracking
        // even when the cursor leaves the box.
        function rrHsvToHex(h, s, v) {
            h = ((h % 360) + 360) % 360;
            var c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
            var r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
            else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
            var to = function (t) { return Math.min(255, Math.max(0, Math.round((t + m) * 255))).toString(16).padStart(2, '0'); };
            return ('#' + to(r) + to(g) + to(b)).toUpperCase();
        }

        window.rrColorBoxBegin = function (boxEl, handleEl, opts, dotNetRef, pointerId, downX, downY) {
            if (!boxEl) return;
            opts = opts || {};
            try { boxEl.setPointerCapture(pointerId); } catch (e) { /* ignore */ }
            var clamp = function (n) { return Math.min(1, Math.max(0, n)); };
            var current = null;

            function apply(cx, cy) {
                var r = boxEl.getBoundingClientRect();
                if (!r.width || !r.height) return;
                var s = clamp((cx - r.left) / r.width);
                var v = clamp(1 - (cy - r.top) / r.height);
                var hex = rrHsvToHex(opts.hue || 0, s, v);
                current = hex;
                if (handleEl) {
                    handleEl.style.left = (s * 100) + '%';
                    handleEl.style.top = ((1 - v) * 100) + '%';
                    handleEl.style.background = hex;
                }
                try {
                    window.previewThemeAccent({
                        accent: hex, light: opts.light, dark: opts.dark,
                        darker: opts.darker, soft: opts.soft
                    });
                } catch (e) { /* ignore */ }
            }

            function move(ev) { apply(ev.clientX, ev.clientY); }
            function end() {
                document.removeEventListener('pointermove', move, true);
                document.removeEventListener('pointerup', end, true);
                document.removeEventListener('pointercancel', end, true);
                try { boxEl.releasePointerCapture(pointerId); } catch (e) { /* ignore */ }
                if (current && dotNetRef) {
                    try { dotNetRef.invokeMethodAsync('OnSvCommitted', current); } catch (e) { /* ignore */ }
                }
            }

            document.addEventListener('pointermove', move, true);
            document.addEventListener('pointerup', end, true);
            document.addEventListener('pointercancel', end, true);
            apply(downX, downY);
        };

        function getSoundSettingsSafe() {
            try {
                return window.getSoundSettings();
            } catch (e) {
                return soundDefaults;
            }
        }

        const clickSoundDelayMs = 200;
        const clickSoundSuppressMs = 400;
        let clickSoundTimeoutId = null;
        let clickSoundToken = 0;
        let clickSoundSuppressedUntil = 0;

        function playAudioElement(audio, volume) {
            if (!audio) return;
            try {
                audio.volume = volume;
                audio.currentTime = 0;
                const playPromise = audio.play();
                if (playPromise && playPromise.catch) {
                    playPromise.catch(() => { });
                }
            } catch (e) {
                // Ignore audio errors.
            }
        }

        function suppressClickSoundFor(durationMs) {
            const until = Date.now() + durationMs;
            if (until > clickSoundSuppressedUntil) {
                clickSoundSuppressedUntil = until;
            }

            if (clickSoundTimeoutId) {
                clearTimeout(clickSoundTimeoutId);
                clickSoundTimeoutId = null;
            }

            clickSoundToken++;
        }

        function scheduleClickSound() {
            const token = ++clickSoundToken;

            if (clickSoundTimeoutId) {
                clearTimeout(clickSoundTimeoutId);
                clickSoundTimeoutId = null;
            }

            clickSoundTimeoutId = setTimeout(() => {
                if (clickSoundToken !== token) return;
                if (Date.now() < clickSoundSuppressedUntil) return;

                window.playClickSound();
                clickSoundTimeoutId = null;
            }, clickSoundDelayMs);
        }

        function playClickFallback() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                if (!window._clickAudioContext) {
                    window._clickAudioContext = new AudioContext();
                }

                const context = window._clickAudioContext;
                if (context.state === 'suspended') {
                    context.resume();
                }

                const oscillator = context.createOscillator();
                const gain = context.createGain();
                const now = context.currentTime;

                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(900, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                oscillator.connect(gain);
                gain.connect(context.destination);

                oscillator.start(now);
                oscillator.stop(now + 0.04);
            } catch (e) {
                // Ignore audio errors.
            }
        }

        window.playNotificationSound = function () {
            suppressClickSoundFor(clickSoundSuppressMs);

            const settings = getSoundSettingsSafe();
            if (!settings.enabled || !settings.notificationEnabled) return;

            const audio = document.getElementById('notify-audio');
            playAudioElement(audio, settings.notificationVolume ?? 0.35);
        };

        window.playClickSound = function () {
            const settings = getSoundSettingsSafe();
            if (!settings.enabled || !settings.clickEnabled) return;

            const audio = document.getElementById('click-audio');
            if (audio && audio.src) {
                playAudioElement(audio, settings.clickVolume ?? 0.2);
                return;
            }

            playClickFallback();
        };

        function ensureClickSoundListener() {
            if (window._clickSoundListenerAttached) {
                return;
            }

            window._clickSoundListenerAttached = true;
            document.addEventListener('click', (event) => {
                const settings = getSoundSettingsSafe();
                if (!settings.enabled || !settings.clickEnabled) return;

                if (!(event.target instanceof Element)) return;

                const interactive = event.target.closest('button, a, input, select, textarea, [role="button"], .clickable');
                if (!interactive || interactive.hasAttribute('disabled')) return;
                if (interactive.closest('[data-sound-skip]')) return;

                scheduleClickSound();
            }, true);
        }

        ensureClickSoundListener();

        window.startLocationPicker = function (dotNetRef) {
            // Just notify C# to start picking - it will handle everything
            dotNetRef.invokeMethodAsync('StartGlobalLocationPicker');
        };

        window.renderHeatmap = function (clickData) {
            const canvas = document.getElementById('heatmapCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Count clicks per position
            const clickMap = {};
            clickData.forEach(click => {
                const key = `${click.x},${click.y}`;
                clickMap[key] = (clickMap[key] || 0) + 1;
            });

            // Find max clicks
            const maxClicks = Math.max(...Object.values(clickMap));

            // Draw heatmap
            Object.entries(clickMap).forEach(([key, count]) => {
                const [x, y] = key.split(',').map(Number);
                const intensity = count / maxClicks;

                // Scale coordinates to canvas
                const canvasX = (x / screen.width) * canvas.width;
                const canvasY = (y / screen.height) * canvas.height;

                // Color from blue (cold) to red (hot)
                const r = Math.floor(255 * intensity);
                const g = Math.floor(255 * (1 - intensity) * 0.5);
                const b = Math.floor(255 * (1 - intensity));
                const alpha = 0.3 + (intensity * 0.7);

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(canvasX, canvasY, 20, 0, Math.PI * 2);
                ctx.fill();

                // Add glow effect for hot spots
                if (intensity > 0.7) {
                    ctx.fillStyle = `rgba(255, 255, 0, ${intensity * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(canvasX, canvasY, 30, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        };
    </script>

    <script>
        (function () {
            let _searchRef = null;
            let _keyHandler = null;

            window.registerGlobalSearch = function (dotNetRef) {
                _searchRef = dotNetRef;
                _keyHandler = function (e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        e.stopPropagation();
                        if (_searchRef) {
                            _searchRef.invokeMethodAsync('ToggleSearch');
                        }
                    }
                };
                document.addEventListener('keydown', _keyHandler, true);
            };

            window.triggerGlobalSearch = function () {
                if (_searchRef) {
                    _searchRef.invokeMethodAsync('ToggleSearch');
                }
            };

            window.unregisterGlobalSearch = function () {
                if (_keyHandler) {
                    document.removeEventListener('keydown', _keyHandler, true);
                    _keyHandler = null;
                }
                _searchRef = null;
            };
        })();
    </script>

    <script>
        // Decides whether the colour-picker popover should flip upward (open above the
        // swatch instead of below) based on the available room. Pure layout query — no
        // top/left math, since the popover is absolutely positioned relative to its
        // swatch wrapper. Called by Components/Shared/ColorField.razor on every open.
        window.rrColorMeasureFlip = function (swatchEl, popHeight) {
            if (!swatchEl) return false;
            var rect = swatchEl.getBoundingClientRect();
            var vh = window.innerHeight || document.documentElement.clientHeight;
            var spaceBelow = vh - rect.bottom;
            var spaceAbove = rect.top;
            // Flip up if below-room is too tight AND there's more space above.
            return spaceBelow < popHeight && spaceAbove > spaceBelow;
        };
    </script>
