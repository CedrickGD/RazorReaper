;Copy and paste the whole file in BaseDeviceProfiles.ini, found in ARK\Engine\Config
 
 
 
;Disable Mouse Smoothing
 
;Go to ARK\Engine\Config
 
;Open BaseInput.ini and set:
 
;bEnableMouseSmoothing=false
 
 
 
;Launch Options
 
;Go to Steam -> ARK -> Properties -> Launch Options and paste:
 
;-lowmemory -high -USEALLAVAILABLECORES -sm4 -novsync -malloc=system +r_waterforcereflectentities 0 +gfx_nvnUseLowLatency 1 -NOSPLASH -usecache -nomansky -PREFERREDPROCESSOR 16
 
;(Change "16" to your CPU's amount of threads)
 
 
 
