[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=
;Have number as 1 for shortest bushes/leaves view distance, causes rocks to be fully black from some distance, 2 for normal bushes/leaves view distance, or 0 for bushes/leaves, pearls and aberration rocks to be invisible
+CVars=foliage.UseOcclusionType=0
 
;Have numbers in this section as 2 for tek railgun/helmet/bloodstalker/snow owl vision to work, also removes clear underwater and enables plant x, z & beer screen effect, have as 0 for the opposite effect of the aforementioned
+CVars=ShowFlag.Materials=2
+CVars=r.CustomDepth=2
 
;Have numbers as 0 for water tops, drop beams, flames, mana beams, placing structures & many other similar effects to be invisible, or have numbers as 2 for them to be like normal
+CVars=ShowFlag.GameplayDebug=2
+CVars=ShowFlag.Splines=2
 
;Have number as 1 for trees & rocks to be invisible (has to be combined with foliage.useOcclusionType=0), also completely breaks aberration & makes cave walls on valguero fully see through, or have number as 0 to have the aforementioned as normal
+CVars=foliage.CullAll=0
 
;Have number as 1 or 2 to reduce the amount of particles from effects such as the flamethrower & poison, have number as 16 for roughly the normal amount
+CVars=FX.MaxCPUParticlesPerEmitter=1
 
;Adjust the number according to desired framerate cap, have it as 0 for unlimited, above 240 seems to cause sporadic issues with movement
+CVars=t.maxfps=240
 
;Remove this section to enable shadows, also remove d3d10, sm4 and DirectX 10 launch options
